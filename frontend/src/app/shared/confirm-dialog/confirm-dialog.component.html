<!-- confirm-dialog.component.html — modal overlay with message + actions.
     Clicking the backdrop cancels; the dialog body stops propagation so inner clicks don't. -->
<div class="dialog-overlay" (click)="cancel.emit()">
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    (click)="$event.stopPropagation()">
    <h3 class="dialog__title" id="confirm-dialog-title">{{ title() }}</h3>
    <p class="dialog__message">{{ message() }}</p>

    <div class="dialog__actions">
      <button type="button" class="btn btn--ghost" (click)="cancel.emit()">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="btn btn--danger" (click)="confirm.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
